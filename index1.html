<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniPath 3D - Virtual Pathology Laboratory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f1f5f9;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #334155;
      padding: 18px;
      border-radius: 12px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    header h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      outline: none;
    }
    select:focus {
      border-color: #38bdf8;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #supervisor-box {
      margin-top: 14px;
      padding: 12px;
      background: #020617;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      font-size: 0.85rem;
      min-height: 60px;
      line-height: 1.45;
      color: #e2e8f0;
    }
    .caution-alert {
      border-left-color: #ef4444 !important;
      background: rgba(127, 29, 29, 0.25) !important;
      color: #fca5a5 !important;
    }
    #help-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      font-size: 0.8rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-panel">
    <header>
      <h1>OmniPath 3D</h1>
      <p>Lead: Enzamamul Hoque | Mangaldai College (ML&MDT)</p>
    </header>

    <div class="form-group">
      <label for="deptSelect">Pathology Department</label>
      <select id="deptSelect" onchange="updateDepartmentOptions()">
        <option value="Microbiology">Microbiology</option>
        <option value="Molecular Diagnostics">Molecular Diagnostics</option>
      </select>
    </div>

    <div class="form-group">
      <label for="actionSelect">Manual Action</label>
      <select id="actionSelect"></select>
    </div>

    <button id="execBtn" onclick="sendActionToSupervisor()">Execute Manual Action</button>

    <div id="supervisor-box">Awaiting student manual action...</div>
  </div>

  <div id="help-hint">Tip: Click directly on 3D equipment on the lab bench to inspect</div>
  <div id="canvas-container"></div>

  <script>
    // --- 1. Department Action Registry ---
    const departmentActions = {
      "Microbiology": [
        "Pass glass slide through Bunsen flame 3 times to heat-fix smear",
        "Pour 95% Ethanol directly over the open Bunsen burner flame",
        "Pipette 0.5 mL Crystal Violet over slide on the staining rack for 60s",
        "Rinse glass slide gently with a stream of distilled water",
        "Apply Gram's Iodine mordant to slide for 60 seconds",
        "Rinse slide and counterstain with 0.5 mL Safranin for 45 seconds"
      ],
      "Molecular Diagnostics": [
        "Place 0.2 mL PCR tubes into cold block rack at -20°C",
        "Vortex Taq DNA Polymerase vigorously at high speed for 30 seconds",
        "Pipette 12.5 µL 2X PCR Master Mix into PCR reaction tube using filter tip",
        "Add template DNA without changing the pipette filter tip",
        "Seal PCR tube tightly and transfer to automated thermal cycler"
      ]
    };

    function updateDepartmentOptions() {
      const dept = document.getElementById("deptSelect").value;
      const actionSelect = document.getElementById("actionSelect");
      actionSelect.innerHTML = "";

      departmentActions[dept].forEach(action => {
        const opt = document.createElement("option");
        opt.value = action;
        opt.textContent = action;
        actionSelect.appendChild(opt);
      });
    }
    updateDepartmentOptions();

    // --- 2. Three.js 3D Virtual Lab Scene ---
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.2, 5.5);
    camera.lookAt(0, 0.4, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const mainLight = new THREE.DirectionalLight(0xe0f2fe, 0.9);
    mainLight.position.set(4, 8, 6);
    scene.add(mainLight);

    // Lab Bench Top
    const tableMesh = new THREE.Mesh(
      new THREE.BoxGeometry(7, 0.2, 3.5),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.2 })
    );
    tableMesh.position.y = -0.1;
    scene.add(tableMesh);

    // Interactive 3D Objects
    const clickableObjects = [];

    // Reagent Beaker
    const beakerMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.35, 0.9, 32),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5, roughness: 0.1 })
    );
    beakerMesh.position.set(-1.8, 0.45, 0);
    beakerMesh.name = "Reagent Beaker (95% Ethanol)";
    scene.add(beakerMesh);
    clickableObjects.push(beakerMesh);

    // Bunsen Burner
    const burnerMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.4, 0.7, 24),
      new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8, roughness: 0.3 })
    );
    burnerMesh.position.set(1.6, 0.35, 0);
    burnerMesh.name = "Bunsen Burner Station";
    scene.add(burnerMesh);
    clickableObjects.push(burnerMesh);

    // Staining Basin / Rack
    const rackMesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.15, 0.8),
      new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.5, roughness: 0.4 })
    );
    rackMesh.position.set(0, 0.1, 0.3);
    rackMesh.name = "Staining Basin & Slide Rack";
    scene.add(rackMesh);
    clickableObjects.push(rackMesh);

    // Slide on Rack
    const slideMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 0.02, 0.3),
      new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
    );
    slideMesh.position.set(0, 0.2, 0.3);
    slideMesh.name = "Bacterial Smear Microscope Slide";
    scene.add(slideMesh);
    clickableObjects.push(slideMesh);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      beakerMesh.rotation.y += 0.003;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 3. Click-to-Inspect Raycaster ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener("click", (e) => {
      // Ignore clicks originating from inside the UI panel
      if (e.target.closest("#ui-panel")) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(clickableObjects);
      if (intersects.length > 0) {
        const item = intersects[0].object;
        const box = document.getElementById("supervisor-box");
        box.className = "";
        box.innerHTML = `<strong>Inspected Object:</strong> ${item.name}`;
      }
    });

    // --- 4. API Communication with Gemini Backend ---
    async function sendActionToSupervisor() {
      const dept = document.getElementById("deptSelect").value;
      const action = document.getElementById("actionSelect").value;
      const box = document.getElementById("supervisor-box");
      const btn = document.getElementById("execBtn");

      box.className = "";
      box.innerText = "Analyzing manual step with Gemini AI supervisor...";
      btn.disabled = true;

      try {
        const response = await fetch("http://127.0.0.1:8000/api/evaluate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            department: dept,
            test_name: dept === "Microbiology" ? "Gram Staining" : "PCR Master Mix Preparation",
            action: action
          })
        });

        const data = await response.json();
        box.innerText = data.guidance;

        if (data.guidance.includes("CAUTION")) {
          box.classList.add("caution-alert");
        }
      } catch (err) {
        box.innerText = "Connection error: Start your Python backend (python backend/app.py) at http://127.0.0.1:8000.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
